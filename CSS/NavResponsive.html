<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar Responsive</title>
    <link rel="stylesheet" href="NavResponsive.css">
</head>
<body>
    <nav class="navbar">
        <h1 class="navbar-title">Navbar</h1>
        
        <ul class="navbar-links">
            <li><a href="#home" class="navbar-link">Home</a></li>
            <li><a href="#link" class="navbar-link">Link</a></li>
            <li><button class="navbar-dropdown">Dropdown</button></li>
            <li><button class="navbar-disabled" disabled>Disabled</button></li>
        </ul>

        <input type="text" class="search-input" placeholder="Search" />
        <button class="search-button">Search</button>

        <!-- Menu hamburger disegnato con CSS -->
        <div class="hamburger-menu">
            <span></span>
        </div>
    </nav>
</body>
</html>
