<!-- // Navigare il DOM
// Stampa in ordine in console:

// l'elemento padre di ul.
// il secondo elemento figlio di ul.
// l'elemento fratello successivo del secondo li.
// l'elemento fratello precedente del secondo li.
// Il tutto utilizzando tutte e 4 le proprietà viste nel video. -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <ul>
        <li>1</li>
        <li>2</li>
        <li>3</li>
    </ul>
    <script>
        // Selezioniamo l'elemento <ul>
        const ul = document.querySelector('ul');
        
        // 1. L'elemento padre di <ul>
        const parent = ul.parentNode;
        console.log('Elemento padre di ul:', parent);

        // 2. Il secondo elemento figlio di <ul>
        const secondChild = ul.children[1];
        console.log('Secondo elemento figlio di ul:', secondChild.innerText);

        // 3. L'elemento fratello successivo del secondo <li>
        const secondLi = ul.children[1];
        const nextSibling = secondLi.nextElementSibling;
        console.log('Elemento fratello successivo del secondo li:', nextSibling.innerText);

        // 4. L'elemento fratello precedente del secondo <li>
        const previousSibling = secondLi.previousElementSibling;
        console.log('Elemento fratello precedente del secondo li:', previousSibling.innerText);
    </script>
</body>

</html>
